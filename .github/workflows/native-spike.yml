name: Native client and feasibility checks

on:
  pull_request:
    paths: ['swift/**', 'api/**', 'server/**', 'scripts/export_openapi.py', 'scripts/serve_contract_fixture.py', 'scripts/generate_native_project.py', '.github/workflows/native-spike.yml']
  push:
    branches: [main, 'feature/**', 'codex/**']
    paths: ['swift/**', 'api/**', 'server/**', 'scripts/export_openapi.py', 'scripts/serve_contract_fixture.py', 'scripts/generate_native_project.py', '.github/workflows/native-spike.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.14'
      - name: Generate and check native contract
        run: |
          python -m pip install -r requirements.lock.txt
          python -m scripts.export_openapi --check
      - name: Generated client against isolated server
        run: |
          python -m scripts.serve_contract_fixture > /tmp/pig-contract.log 2>&1 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          python - <<'PY'
          import time, urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8781/api/health')
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise SystemExit('Contract fixture did not start')
          PY
          PIG_CONTRACT_SERVER=http://127.0.0.1:8781 swift test --package-path swift/PigKit
      - name: Unsigned generated iPhone client build
        working-directory: swift/PigKit
        run: |
          xcodebuild -quiet -scheme PigAPI -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ../build/PigKitSimulator -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Unsigned production iPhone and iPad build
        run: |
          xcodebuild -quiet -project swift/PigMusic.xcodeproj -scheme PigMusic \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath swift/build/PigMusic \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Shared core tests
        run: swift test --package-path swift/NativeSpike
      - name: Unsigned iPhone and embedded Watch simulator build
        run: |
          xcodebuild -quiet -project swift/NativeSpike/PigMusicNativeSpike.xcodeproj \
            -scheme PigMusicNativeSpike -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath swift/build/DerivedData -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
